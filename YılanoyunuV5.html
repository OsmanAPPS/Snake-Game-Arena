<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yılan Oyunu - Arena</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }
        canvas {
            background-color: #1a202c;
            border: 2px solid #374151;
        }
        #leaderboard, #minimap-container, #ability-container, #stats-container, #skin-market-modal {
            background-color: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(5px);
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .market-tab {
            transition: all 0.2s ease-in-out;
        }
        .market-tab.active {
            background-color: #4f46e5;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body class="bg-gray-900 text-white flex items-center justify-center min-h-screen">

    <div id="game-container" class="w-screen h-screen relative">
        <canvas id="gameCanvas"></canvas>

        <!-- UI Overlays -->
        <div id="ui-container" class="absolute inset-0 pointer-events-none">
            <!-- Skor -->
            <div id="score-container" class="absolute top-4 left-4 text-2xl bg-black bg-opacity-40 p-3 rounded-lg">
                <p><span class="font-bold text-yellow-400">Skor:</span> <span id="score">0</span></p>
            </div>

            <!-- Liderlik Tablosu -->
            <div id="leaderboard" class="absolute top-4 right-4 p-3 w-64">
                <h3 class="text-lg font-bold text-center mb-2 text-cyan-400">Liderlik Tablosu</h3>
                <ol id="leaderboard-list" class="list-decimal list-inside text-gray-200"></ol>
            </div>

            <!-- Mini Harita -->
            <div id="minimap-container" class="absolute bottom-4 right-4">
                <canvas id="minimapCanvas" class="rounded-md"></canvas>
            </div>

            <!-- YETENEK UI (Dinamik Hale Getirildi) -->
            <div id="ability-container" class="absolute bottom-4 left-4 p-3 flex space-x-4">
                <div id="equipped-ability-ui" class="text-center hidden">
                    <h4 id="equipped-ability-name" class="text-sm font-bold text-gray-300"></h4>
                    <div id="ability-cooldown-bar" class="w-32 h-4 bg-gray-700 rounded mt-1 overflow-hidden">
                        <div id="ability-cooldown-fill" class="h-full transition-all duration-200"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Başlangıç/Oyun Bitti Modalı -->
        <div id="game-modal" class="absolute inset-0 bg-black bg-opacity-70 flex flex-col items-center justify-center">
            <h2 id="modal-title" class="text-5xl font-bold text-green-500">Oyuna Başla</h2>
            <div id="stats-container" class="p-4 mt-4 text-lg hidden">
                <p id="modal-score" class="text-2xl text-white"></p>
                <hr class="my-2 border-gray-600">
                <p>En Yüksek Skor: <span id="max-score" class="text-yellow-400 font-bold">0</span></p>
                <p>Yenilen Botlar: <span id="bots-defeated" class="text-red-400 font-bold">0</span></p>
                <p>Toplanan Güçlendirmeler: <span id="powerups-collected" class="text-purple-400 font-bold">0</span></p>
            </div>
             <div id="start-controls" class="mt-4 text-center">
                 <p class="text-gray-400 mt-4 max-w-md text-center">Kontrol için <b class="text-white">Fareyi</b> kullan, hızlanmak için <b class="text-white">Sol Tık/Boşluk</b> basılı tut.<br>Seçili Yeteneği kullanmak için <b class="text-white">[G]</b> tuşuna bas.</p>
             </div>
            <div class="flex space-x-4">
                <button id="startBtn" class="mt-8 bg-cyan-500 hover:bg-cyan-600 text-white font-bold py-3 px-6 rounded-lg transition-transform transform hover:scale-105 text-xl">
                    Oyuna Başla
                </button>
                <button id="open-market-btn" class="mt-8 bg-purple-500 hover:bg-purple-600 text-white font-bold py-3 px-6 rounded-lg transition-transform transform hover:scale-105 text-xl">
                    Market 🛒
                </button>
            </div>
        </div>
        
        <!-- Market Modalı -->
        <div id="skin-market-modal" class="absolute inset-0 bg-black bg-opacity-80 flex-col items-center justify-center p-8 hidden">
            <h2 class="text-4xl font-bold text-yellow-400 mb-4">Market</h2>
             <div class="mb-4">
                 <p class="text-2xl text-yellow-400">💰 <span id="coin-balance">0</span></p>
             </div>
            <div class="flex space-x-2 bg-gray-800 p-1 rounded-lg mb-4">
                <button id="show-skins-tab" class="market-tab active py-2 px-6 rounded-md font-semibold">Desenler</button>
                <button id="show-abilities-tab" class="market-tab py-2 px-6 rounded-md font-semibold">Yetenekler</button>
            </div>
            
            <!-- Desen Seçici -->
            <div id="skin-selector-container">
                <div class="flex items-center justify-center space-x-4 mb-2">
                    <button id="prev-skin" class="bg-gray-700 p-2 rounded-full hover:bg-gray-600">&lt;</button>
                    <div class="text-center w-40">
                        <p id="skin-name" class="font-bold text-lg h-7"></p>
                        <div id="skin-preview" class="w-24 h-8 rounded-lg mx-auto mt-1 border-2 border-transparent"></div>
                    </div>
                    <button id="next-skin" class="bg-gray-700 p-2 rounded-full hover:bg-gray-600">&gt;</button>
                </div>
                <div id="skin-action-container" class="mt-2 h-10 text-center"></div>
            </div>
            
            <!-- Yetenek Seçici -->
            <div id="ability-selector-container" class="hidden">
                 <div class="flex items-center justify-center space-x-4 mb-2">
                    <button id="prev-ability" class="bg-gray-700 p-2 rounded-full hover:bg-gray-600">&lt;</button>
                    <div class="text-center w-64 min-h-[80px]">
                        <p id="ability-name" class="font-bold text-lg"></p>
                        <p id="ability-description" class="text-sm text-gray-400 mt-1"></p>
                    </div>
                    <button id="next-ability" class="bg-gray-700 p-2 rounded-full hover:bg-gray-600">&gt;</button>
                </div>
                <div id="ability-action-container" class="mt-2 h-10 text-center"></div>
            </div>
            
            <button id="close-market-btn" class="mt-8 bg-gray-600 hover:bg-gray-700 text-white font-bold py-2 px-5 rounded-lg">Kapat</button>
        </div>
    </div>

    <script>
    // --- SETUP ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const minimapCanvas = document.getElementById('minimapCanvas');
    const minimapCtx = minimapCanvas.getContext('2d');
    
    // UI Elements
    const scoreEl = document.getElementById('score');
    const gameModal = document.getElementById('game-modal');
    const modalTitle = document.getElementById('modal-title');
    const modalScore = document.getElementById('modal-score');
    const startBtn = document.getElementById('startBtn');
    const leaderboardList = document.getElementById('leaderboard-list');
    const statsContainer = document.getElementById('stats-container');
    const maxScoreEl = document.getElementById('max-score');
    const botsDefeatedEl = document.getElementById('bots-defeated');
    const powerupsCollectedEl = document.getElementById('powerups-collected');
    const startControls = document.getElementById('start-controls');
    // In-game Ability UI
    const equippedAbilityUI = document.getElementById('equipped-ability-ui');
    const equippedAbilityNameEl = document.getElementById('equipped-ability-name');
    const abilityCooldownFill = document.getElementById('ability-cooldown-fill');
    
    // Market Elements
    const skinMarketModal = document.getElementById('skin-market-modal');
    const openMarketBtn = document.getElementById('open-market-btn');
    const closeMarketBtn = document.getElementById('close-market-btn');
    const coinBalanceEl = document.getElementById('coin-balance');
    const showSkinsTab = document.getElementById('show-skins-tab');
    const showAbilitiesTab = document.getElementById('show-abilities-tab');
    // Skin Market
    const skinSelectorContainer = document.getElementById('skin-selector-container');
    const skinNameEl = document.getElementById('skin-name');
    const skinPreview = document.getElementById('skin-preview');
    const prevSkinBtn = document.getElementById('prev-skin');
    const nextSkinBtn = document.getElementById('next-skin');
    const skinActionContainer = document.getElementById('skin-action-container');
    // Ability Market
    const abilitySelectorContainer = document.getElementById('ability-selector-container');
    const abilityNameEl = document.getElementById('ability-name');
    const abilityDescriptionEl = document.getElementById('ability-description');
    const prevAbilityBtn = document.getElementById('prev-ability');
    const nextAbilityBtn = document.getElementById('next-ability');
    const abilityActionContainer = document.getElementById('ability-action-container');

    // --- SOUND ENGINE ---
    const soundEngine = {
        audioCtx: null,
        musicNode: null,
        boostNode: null,
        init() {
            if (this.audioCtx) return;
            try {
                this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            } catch (e) {
                console.error("Web Audio API is not supported in this browser");
            }
        },
        play(type) {
            if (!this.audioCtx) return;
            const now = this.audioCtx.currentTime;
            const osc = this.audioCtx.createOscillator();
            const gain = this.audioCtx.createGain();
            osc.connect(gain);
            gain.connect(this.audioCtx.destination);
            gain.gain.setValueAtTime(0.2, now);

            switch (type) {
                case 'eat':
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(880, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
                    osc.start(now);
                    osc.stop(now + 0.1);
                    break;
                case 'death':
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(440, now);
                    osc.frequency.exponentialRampToValueAtTime(110, now + 0.5);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
                    osc.start(now);
                    osc.stop(now + 0.5);
                    break;
                case 'powerup':
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(440, now);
                    osc.frequency.exponentialRampToValueAtTime(880, now + 0.2);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
                    osc.start(now);
                    osc.stop(now + 0.2);
                    break;
                case 'ability':
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(1000, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
                    osc.start(now);
                    osc.stop(now + 0.15);
                    break;
                case 'click':
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(660, now);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
                    osc.start(now);
                    osc.stop(now + 0.08);
                    break;
            }
        },
        startBoost() {
            if (!this.audioCtx || this.boostNode) return;
            const now = this.audioCtx.currentTime;
            this.boostNode = {};
            this.boostNode.osc = this.audioCtx.createOscillator();
            this.boostNode.gain = this.audioCtx.createGain();
            this.boostNode.osc.connect(this.boostNode.gain);
            this.boostNode.gain.connect(this.audioCtx.destination);
            this.boostNode.osc.type = 'sawtooth';
            this.boostNode.osc.frequency.setValueAtTime(80, now);
            this.boostNode.gain.gain.setValueAtTime(0, now);
            this.boostNode.gain.gain.linearRampToValueAtTime(0.1, now + 0.1);
            this.boostNode.osc.start(now);
        },
        stopBoost() {
            if (!this.boostNode) return;
            const now = this.audioCtx.currentTime;
            this.boostNode.gain.gain.linearRampToValueAtTime(0, now + 0.1);
            this.boostNode.osc.stop(now + 0.1);
            this.boostNode = null;
        },
        startMusic() {
            if (!this.audioCtx || this.musicNode) return;
            const now = this.audioCtx.currentTime;
            this.musicNode = {};
            this.musicNode.osc = this.audioCtx.createOscillator();
            this.musicNode.gain = this.audioCtx.createGain();
            this.musicNode.osc.connect(this.musicNode.gain);
            this.musicNode.gain.connect(this.audioCtx.destination);

            const scale = [220, 261, 293, 329, 392, 440]; // A minor pentatonic
            let noteIndex = 0;
            const tempo = 120;
            const noteDuration = 60 / tempo;

            this.musicNode.osc.type = 'sine';
            this.musicNode.gain.gain.setValueAtTime(0, now);
            this.musicNode.gain.gain.linearRampToValueAtTime(0.08, now + 1);
            this.musicNode.osc.start(now);

            this.musicNode.interval = setInterval(() => {
                const freq = scale[noteIndex % scale.length];
                const nextFreq = scale[(noteIndex + Math.floor(Math.random() * 3)) % scale.length];
                this.musicNode.osc.frequency.setValueAtTime(freq, this.audioCtx.currentTime);
                this.musicNode.osc.frequency.linearRampToValueAtTime(nextFreq, this.audioCtx.currentTime + noteDuration * 2);
                noteIndex++;
            }, noteDuration * 1000 * 2);
        },
        stopMusic() {
            if (!this.musicNode) return;
            const now = this.audioCtx.currentTime;
            this.musicNode.gain.gain.linearRampToValueAtTime(0, now + 1);
            this.musicNode.osc.stop(now + 1);
            clearInterval(this.musicNode.interval);
            this.musicNode = null;
        }
    };

    // --- GAME CONSTANTS ---
    const WORLD_WIDTH = 4000;
    const WORLD_HEIGHT = 4000;
    const PLAYER_NAME = "Sen";
    const BOT_COUNT = 15;
    const BOT_NAMES = ["Alfa", "Beta", "Gama", "Delta", "Epsilon", "Zeta", "Eta", "Theta", "Iota", "Kappa", "Lambda", "Mu", "Nu", "Xi", "Omicron"];
    const MINIMAP_SIZE = 150;
    const FRUIT_COLORS = ['#ef4444', '#f97316', '#84cc16', '#22c55e', '#14b8a6', '#6366f1', '#a855f7'];
    const POWERUP_TYPES = { SHIELD: 'SHIELD', MAGNET: 'MAGNET', VISION: 'VISION' };
    const KING_OF_THE_HILL_ZONE = { x: WORLD_WIDTH / 2, y: WORLD_HEIGHT / 2, radius: 400 };

    const SKINS = [
        { name: 'Düz Renk', type: 'solid', cost: 0 },
        { name: 'Halkalı', type: 'striped', colors: ['#ffffff', '#d1d5db'], cost: 100 },
        { name: 'Zebra', type: 'striped', colors: ['#111827', '#e5e7eb'], cost: 250 },
        { name: 'Gökkuşağı', type: 'rainbow', cost: 500 },
        { name: 'Alev', type: 'striped', colors: ['#f97316', '#facc15'], cost: 750 },
        { name: 'Hayalet', type: 'transparent', cost: 1500 },
        { name: 'Altın Yılan', type: 'striped', colors: ['#facc15', '#ca8a04'], cost: 2500 }
    ];
    
    const ABILITIES = [
        { id: 'NONE', name: 'Yetenek Yok', description: 'Yetenek kuşanılmadı.', cost: 0, color: '#6b7280'},
        { id: 'GHOST', name: 'Hayalet', description: 'Kısa süreliğine diğer yılanların ve kendi vücudunun içinden geçmeni sağlar.', cost: 800, color: '#22d3ee'},
        { id: 'PULSE', name: 'İtme Dalgası', description: 'Etrafındaki küçük yılanları ve yemleri iten bir şok dalgası oluşturur.', cost: 1200, color: '#a855f7'},
        { id: 'DECOY', name: 'İkiz Yem', description: 'Yapay zekayı kandırmak için kuyruğundan ayrılan sahte bir yılan klonu oluşturur.', cost: 1000, color: '#94a3b8'},
        { id: 'BLINK', name: 'İleri Atılma', description: 'İmlecin olduğu yöne doğru anlık olarak ileri atılırsın. Tehlikeden kaçmak için mükemmeldir.', cost: 1500, color: '#fde047'},
        { id: 'POISON', name: 'Zehirli İz', description: 'Kısa bir süreliğine arkanda zehirli bir iz bırakırsın. Bu ize dokunan düşmanlar yavaşlar.', cost: 1800, color: '#4ade80'},
        { id: 'SUPER_MAGNET', name: 'Süper Mıknatıs', description: 'Çok geniş bir alandaki tüm yemleri anında kendine çeker. Hızlı büyüme için ideal.', cost: 2000, color: '#f472b6'},
        { id: 'RAGE', name: 'Öfke', description: 'Kısa süreliğine hızını ve boyutunu artırır. Etki bitince eski boyutuna dönersin.', cost: 2500, color: '#ef4444'}
    ];

    // --- GAME & MARKET STATE ---
    let player;
    let bots = [];
    let food = [];
    let powerups = [];
    let particles = [];
    let pulseWaves = [];
    let poisonTrails = [];
    let decoys = [];
    let gameState = 'menu';
    let keysPressed = {};
    let mousePos = { x: 0, y: 0 };
    let isLeftMouseDown = false;
    let camera = { x: 0, y: 0, zoom: 1 };
    let animationFrameId = null;
    let worldTime = 0;
    let currentMarketTab = 'skins';
    let currentSkinIndex = 0;
    let currentAbilityIndex = 0;
    
    // --- PERSISTENT DATA ---
    let gameData = {
        coins: 0,
        unlockedSkins: ['Düz Renk'],
        selectedSkinName: 'Düz Renk',
        unlockedAbilities: ['NONE'],
        equippedAbility: 'NONE'
    };
    let gameStats = { maxScore: 0, botsDefeated: 0, powerupsCollected: 0 };

    // --- CLASSES ---
    class Particle { /* ... No changes ... */
        constructor(x, y, color, size, speed, lifespan) {
            this.x = x; this.y = y; this.color = color; this.size = size;
            const angle = Math.random() * Math.PI * 2;
            this.vx = Math.cos(angle) * speed * Math.random();
            this.vy = Math.sin(angle) * speed * Math.random();
            this.lifespan = lifespan; this.opacity = 1;
        }
        update() { this.x += this.vx; this.y += this.vy; this.lifespan--; this.opacity = this.lifespan / 100; }
        draw() { ctx.globalAlpha = this.opacity; ctx.fillStyle = this.color; ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1; }
    }

    class PulseWave { /* ... No changes ... */
        constructor(x, y, owner) {
            this.x = x; this.y = y; this.owner = owner; this.radius = 10; this.maxRadius = 250;
            this.speed = 8; this.lifespan = this.maxRadius / this.speed; this.opacity = 0.8;
        }
        update() { this.radius += this.speed; this.lifespan--; this.opacity = (this.lifespan / (this.maxRadius / this.speed)) * 0.8; }
        draw() { ctx.strokeStyle = `rgba(168, 85, 247, ${this.opacity})`; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2); ctx.stroke(); }
    }

    class PoisonPuff {
        constructor(x, y, owner) {
            this.x = x; this.y = y; this.owner = owner;
            this.radius = 8; this.lifespan = 300; this.opacity = 0.6;
        }
        update() { this.lifespan--; this.opacity = (this.lifespan / 300) * 0.6; }
        draw() {
            ctx.fillStyle = `rgba(74, 222, 128, ${this.opacity})`;
            ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2); ctx.fill();
        }
    }

    class DecoySnake {
        constructor(segments, color) {
            this.segments = segments; this.color = color; this.angle = Math.random() * Math.PI * 2;
            this.speed = 2; this.lifespan = 600; this.segmentRadius = 8;
        }
        update() {
            this.lifespan--;
            if (Math.random() < 0.05) this.angle += (Math.random() - 0.5) * 2;
            const head = this.segments[0];
            head.x += Math.cos(this.angle) * this.speed; head.y += Math.sin(this.angle) * this.speed;
            for (let i = 1; i < this.segments.length; i++) {
                const prev = this.segments[i-1]; const current = this.segments[i];
                const dx = prev.x - current.x; const dy = prev.y - current.y;
                current.x += dx * 0.4; current.y += dy * 0.4;
            }
        }
        draw() {
            ctx.globalAlpha = this.lifespan / 600;
            for (let i = this.segments.length - 1; i >= 0; i--) {
                ctx.fillStyle = this.color;
                ctx.beginPath(); ctx.arc(this.segments[i].x, this.segments[i].y, this.segmentRadius, 0, Math.PI * 2); ctx.fill();
            }
            ctx.globalAlpha = 1;
        }
    }

    class Snake {
        constructor(name, x, y, color, segments = 15) {
            this.name = name; this.segments = []; this.color = color; this.angle = Math.random() * Math.PI * 2;
            this.turnSpeed = 0.1; this.normalSpeed = 2; this.boostSpeed = 4; this.speed = this.normalSpeed;
            this.baseSegmentRadius = 8; this.segmentRadius = this.baseSegmentRadius; this.segmentDist = 5;
            this.isBoosting = false; this.boostCooldown = 0; this.isDead = false;
            this.score = 0; this.level = 1; this.skin = { ...SKINS[0], baseColor: color };
            this.shieldActive = false; this.shieldTimer = 0;
            this.magnetActive = false; this.magnetTimer = 0;
            this.visionActive = false; this.visionTimer = 0;
            this.ghostActive = false; this.ghostTimer = 0;
            this.abilityCooldown = 0;
            this.poisonActive = false; this.poisonTimer = 0;
            this.rageActive = false; this.rageTimer = 0; this.originalSegmentRadius = 0;
            this.isPoisoned = false; this.poisonedTimer = 0;
            this.GHOST_DURATION = 180; 
            this.ABILITY_COOLDOWN_MAX = { GHOST: 600, PULSE: 450, NONE: 0, DECOY: 500, BLINK: 400, POISON: 700, SUPER_MAGNET: 800, RAGE: 900 };

            for (let i = 0; i < segments; i++) this.segments.push({ x: x - i * this.segmentDist, y: y });
        }

        update() {
            if (this.isDead) return;
            this.updateTimers();
            const head = this.segments[0];
            head.x += Math.cos(this.angle) * this.speed;
            head.y += Math.sin(this.angle) * this.speed;

            for (let i = 1; i < this.segments.length; i++) {
                const prev = this.segments[i - 1]; const current = this.segments[i];
                const dx = prev.x - current.x; const dy = prev.y - current.y;
                const distVal = Math.sqrt(dx * dx + dy * dy);
                if (distVal > this.segmentDist) {
                    const moveAngle = Math.atan2(dy, dx);
                    current.x = prev.x - Math.cos(moveAngle) * this.segmentDist;
                    current.y = prev.y - Math.sin(moveAngle) * this.segmentDist;
                }
            }

            if (this.poisonActive && worldTime % 5 === 0) {
                const tail = this.segments[this.segments.length - 1];
                poisonTrails.push(new PoisonPuff(tail.x, tail.y, this));
            }

            this.handleBoosting(); this.checkWallCollision(); this.checkSelfCollision();
            this.score = this.segments.length; this.updateRadius();

            const newLevel = Math.floor(Math.log2(this.score / 15 + 1)) + 1;
            if (newLevel > this.level) {
                this.level = newLevel;
                for(let i = 0; i < 20; i++) particles.push(new Particle(this.segments[0].x, this.segments[0].y, '#ffd700', 5, 4, 80));
            }
        }
        updateRadius() { 
            if (this.rageActive) return;
            this.segmentRadius = this.baseSegmentRadius + Math.log2(Math.max(1, Math.floor(this.score / 20))); 
        }
        updateTimers() {
             if (this.shieldActive) { this.shieldTimer--; if (this.shieldTimer <= 0) this.shieldActive = false; }
             if (this.magnetActive) { this.magnetTimer--; if (this.magnetTimer <= 0) this.magnetActive = false; }
             if (this.visionActive) { this.visionTimer--; if (this.visionTimer <= 0) this.visionActive = false; }
             if (this.ghostActive) { this.ghostTimer--; if (this.ghostTimer <= 0) this.ghostActive = false; }
             if (this.abilityCooldown > 0) this.abilityCooldown--;
             if (this.poisonActive) { this.poisonTimer--; if(this.poisonTimer <= 0) this.poisonActive = false; }
             if (this.rageActive) {
                this.rageTimer--;
                if (this.rageTimer <= 0) { this.rageActive = false; this.segmentRadius = this.originalSegmentRadius; } 
                else { this.segmentRadius += 0.05; }
             }
             if (this.isPoisoned) {
                this.poisonedTimer--;
                if (this.poisonedTimer <= 0) { this.isPoisoned = false; this.speed = this.normalSpeed; } 
                else { this.speed = this.normalSpeed * 0.6; }
            }
        }
        handleBoosting() {
             if (this.rageActive) { this.speed = this.boostSpeed + 1; return; }
             if (this.isPoisoned) { this.speed = this.normalSpeed * 0.6; return; }
             if (this.isBoosting && this.segments.length > 10) {
                 this.speed = this.boostSpeed;
                 if (this.boostCooldown <= 0) {
                     const tail = this.segments.pop();
                     particles.push(new Particle(tail.x, tail.y, this.color, 3, 2, 50));
                     this.boostCooldown = 5;
                 }
             } else { this.speed = this.normalSpeed; }
             if (this.boostCooldown > 0) this.boostCooldown--;
        }
        checkWallCollision() { const head = this.segments[0]; if (head.x < 0 || head.x > WORLD_WIDTH || head.y < 0 || head.y > WORLD_HEIGHT) this.die(); }
        checkSelfCollision() {
            if (this.ghostActive) return;
            const head = this.segments[0];
            for (let i = 4; i < this.segments.length; i++) {
                if (dist(head.x, head.y, this.segments[i].x, this.segments[i].y) < this.segmentRadius) { this.die(); break; }
            }
        }
        useAbility(abilityId) {
            if (this.abilityCooldown > 0) return;
            soundEngine.play('ability');
            switch(abilityId) {
                case 'GHOST':
                    this.ghostActive = true; this.ghostTimer = this.GHOST_DURATION;
                    this.abilityCooldown = this.ABILITY_COOLDOWN_MAX.GHOST; break;
                case 'PULSE':
                    pulseWaves.push(new PulseWave(this.segments[0].x, this.segments[0].y, this));
                    this.abilityCooldown = this.ABILITY_COOLDOWN_MAX.PULSE; break;
                case 'DECOY':
                    if (this.segments.length > 20) {
                        const decoySegments = this.segments.splice(this.segments.length - 15);
                        decoys.push(new DecoySnake(decoySegments, this.color));
                        this.abilityCooldown = this.ABILITY_COOLDOWN_MAX.DECOY;
                    }
                    break;
                case 'BLINK':
                    const blinkDist = 200;
                    const newX = this.segments[0].x + Math.cos(this.angle) * blinkDist;
                    const newY = this.segments[0].y + Math.sin(this.angle) * blinkDist;
                    for (let i = 0; i < 30; i++) particles.push(new Particle(this.segments[0].x, this.segments[0].y, '#fde047', Math.random() * 3, 5, 50));
                    this.segments[0].x = Math.max(0, Math.min(WORLD_WIDTH, newX));
                    this.segments[0].y = Math.max(0, Math.min(WORLD_HEIGHT, newY));
                    for (let i = 0; i < 30; i++) particles.push(new Particle(this.segments[0].x, this.segments[0].y, '#ffffff', Math.random() * 4, 5, 80));
                    this.abilityCooldown = this.ABILITY_COOLDOWN_MAX.BLINK;
                    break;
                case 'POISON':
                    this.poisonActive = true; this.poisonTimer = 240;
                    this.abilityCooldown = this.ABILITY_COOLDOWN_MAX.POISON; break;
                case 'SUPER_MAGNET':
                    const head = this.segments[0];
                    food.forEach(f => { if (dist(head.x, head.y, f.x, f.y) < 400) { f.x = head.x; f.y = head.y; } });
                    this.abilityCooldown = this.ABILITY_COOLDOWN_MAX.SUPER_MAGNET; break;
                case 'RAGE':
                    this.rageActive = true; this.rageTimer = 300;
                    this.originalSegmentRadius = this.segmentRadius;
                    this.abilityCooldown = this.ABILITY_COOLDOWN_MAX.RAGE; break;
            }
        }
        ejectMass() { if (this.segments.length > 10) { const tail = this.segments.pop(); food.push({ x: tail.x, y: tail.y, radius: 4, color: this.color }); } }
        grow(amount = 5) { for (let i = 0; i < amount; i++) this.segments.push({ ...this.segments[this.segments.length - 1] }); }
        die() {
            this.isDead = true;
            soundEngine.play('death');
            this.segments.forEach(seg => { if (Math.random() > 0.5) food.push({ x: seg.x, y: seg.y, radius: 5, color: this.color }); });
        }
        draw() { /* ... No changes ... */
            if (this.ghostActive || this.skin.type === 'transparent') ctx.globalAlpha = 0.5;
            for (let i = this.segments.length - 1; i >= 0; i--) {
                const seg = this.segments[i];
                ctx.fillStyle = this.getSegmentColor(i);
                ctx.beginPath(); ctx.arc(seg.x, seg.y, this.segmentRadius, 0, Math.PI * 2); ctx.fill();
            }
            this.drawEyes();
            ctx.globalAlpha = 1;
            if (this.shieldActive) {
                ctx.strokeStyle = `rgba(59, 130, 246, ${0.5 + Math.sin(Date.now() / 100) * 0.2})`;
                ctx.lineWidth = 4;
                ctx.beginPath(); ctx.arc(this.segments[0].x, this.segments[0].y, this.segmentRadius + 8, 0, Math.PI * 2); ctx.stroke();
            }
        }
        getSegmentColor(index) { /* ... No changes ... */
            switch(this.skin.type) {
                case 'striped': return index % 20 < 10 ? this.skin.baseColor : this.skin.colors[1];
                case 'rainbow': return `hsl(${(worldTime + index * 5) % 360}, 100%, 50%)`;
                case 'transparent': return `rgba(255, 255, 255, 0.5)`;
                case 'solid': default: return this.skin.baseColor;
            }
        }
        drawEyes() { /* ... No changes ... */
            const head = this.segments[0];
            if (!isFinite(head.x) || !isFinite(head.y)) return;
            const eyeRadius = this.segmentRadius * 0.25; const eyeOffset = this.segmentRadius * 0.4;
            const eyeAngle1 = this.angle - Math.PI / 4; const eyeAngle2 = this.angle + Math.PI / 4;
            const eye1x = head.x + Math.cos(eyeAngle1) * eyeOffset; const eye1y = head.y + Math.sin(eyeAngle1) * eyeOffset;
            const eye2x = head.x + Math.cos(eyeAngle2) * eyeOffset; const eye2y = head.y + Math.sin(eyeAngle2) * eyeOffset;
            if (!isFinite(eye1x) || !isFinite(eye1y) || !isFinite(eye2x) || !isFinite(eye2y)) return;
            ctx.fillStyle = 'white';
            ctx.beginPath(); ctx.arc(eye1x, eye1y, eyeRadius, 0, Math.PI * 2); ctx.arc(eye2x, eye2y, eyeRadius, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = 'black';
            ctx.beginPath(); ctx.arc(eye1x, eye1y, eyeRadius * 0.5, 0, Math.PI * 2); ctx.arc(eye2x, eye2y, eyeRadius * 0.5, 0, Math.PI * 2); ctx.fill();
        }
    }

    class Player extends Snake {
        constructor(name, x, y, color) { super(name, x, y, color); this.wasBoosting = false;}
        update() {
            const screenCenterX = canvas.width / 2; const screenCenterY = canvas.height / 2;
            const distFromCenter = dist(mousePos.x, mousePos.y, screenCenterX, screenCenterY);
            if (distFromCenter > 20) {
                const targetAngle = Math.atan2(mousePos.y - screenCenterY, mousePos.x - screenCenterX);
                let angleDiff = targetAngle - this.angle;
                while (angleDiff > Math.PI) angleDiff -= 2 * Math.PI;
                while (angleDiff < -Math.PI) angleDiff += 2 * Math.PI;
                const turnFactor = Math.min(distFromCenter / 200, 1);
                this.angle += angleDiff * this.turnSpeed * turnFactor;
            }
            this.isBoosting = keysPressed['w'] || keysPressed[' '] || isLeftMouseDown || false;
            
            if (this.isBoosting && !this.wasBoosting) soundEngine.startBoost();
            if (!this.isBoosting && this.wasBoosting) soundEngine.stopBoost();
            this.wasBoosting = this.isBoosting;
            
            if (keysPressed['g']) { this.useAbility(gameData.equippedAbility); keysPressed['g'] = false; }
            super.update();
        }
    }

    class Bot extends Snake {
        constructor(name, x, y, color) { super(name, x, y, color); this.target = null; this.decisionTimer = 0; this.isFleeing = false; }
        update() { /* ... No changes ... */
            this.decisionTimer--;
            if (this.decisionTimer <= 0 || !this.target || (this.target.isDead === true)) {
                this.findTarget();
                this.decisionTimer = Math.random() * 60 + 30;
            }
            if (this.target) {
                const dx = this.target.x - this.segments[0].x; const dy = this.target.y - this.segments[0].y;
                const targetAngle = Math.atan2(dy, dx);
                let angleDiff = targetAngle - this.angle;
                while (angleDiff > Math.PI) angleDiff -= 2 * Math.PI;
                while (angleDiff < -Math.PI) angleDiff += 2 * Math.PI;
                this.angle += angleDiff * this.turnSpeed * (this.isFleeing ? 1.5 : 1);
            }
            this.handleBoosting();
            super.update();
        }
        handleBoosting() { /* ... No changes ... */
            const isHunting = this.target && this.target.score && this.score > this.target.score * 1.5;
            if ((this.isFleeing || isHunting) && this.segments.length > 30) {
                 const d = dist(this.segments[0].x, this.segments[0].y, this.target.x, this.target.y);
                 this.isBoosting = d > 150 && d < 450;
            } else { this.isBoosting = false; }
        }
        findTarget() {
            this.isFleeing = false;
            const head = this.segments[0]; const allSnakes = [player, ...bots];
            let potentialTargets = []; const visionRange = 600; const wallMargin = 150;
            if (head.x < wallMargin) potentialTargets.push({ target: { x: head.x + 200, y: head.y }, weight: 20 });
            if (head.x > WORLD_WIDTH - wallMargin) potentialTargets.push({ target: { x: head.x - 200, y: head.y }, weight: 20 });
            if (head.y < wallMargin) potentialTargets.push({ target: { x: head.x, y: head.y + 200 }, weight: 20 });
            if (head.y > WORLD_HEIGHT - wallMargin) potentialTargets.push({ target: { x: head.x, y: head.y - 200 }, weight: 20 });
            allSnakes.forEach(otherSnake => {
                if (otherSnake === this || otherSnake.isDead) return;
                const d = dist(head.x, head.y, otherSnake.segments[0].x, otherSnake.segments[0].y);
                if (this.score < otherSnake.score && d < 350) {
                    const fleeAngle = Math.atan2(head.y - otherSnake.segments[0].y, head.x - otherSnake.segments[0].x);
                    potentialTargets.push({ target: { x: head.x + Math.cos(fleeAngle) * 300, y: head.y + Math.sin(fleeAngle) * 300 }, weight: 15 });
                    this.isFleeing = true;
                }
            });
            if (potentialTargets.some(t => t.weight >= 15)) { potentialTargets.sort((a,b) => b.weight - a.weight); this.target = potentialTargets[0].target; return; }
            
            decoys.forEach(d => {
                const decoyHead = d.segments[0];
                const distToDecoy = dist(head.x, head.y, decoyHead.x, decoyHead.y);
                if (distToDecoy < visionRange) potentialTargets.push({ target: decoyHead, weight: 6 });
            });

            powerups.forEach(p => { if (dist(head.x, head.y, p.x, p.y) < visionRange) potentialTargets.push({ target: p, weight: 12 }); });
            allSnakes.forEach(otherSnake => {
                if (otherSnake === this || otherSnake.isDead) return;
                const d = dist(head.x, head.y, otherSnake.segments[0].x, otherSnake.segments[0].y);
                if (this.score > otherSnake.score + 20 && d < visionRange) {
                     const predictionTime = d / this.speed;
                     const interceptX = otherSnake.segments[0].x + Math.cos(otherSnake.angle) * otherSnake.speed * predictionTime;
                     const interceptY = otherSnake.segments[0].y + Math.sin(otherSnake.angle) * otherSnake.speed * predictionTime;
                     potentialTargets.push({ target: { x: interceptX, y: interceptY, score: otherSnake.score}, weight: 8 });
                }
            });
            food.forEach(f => { const d = dist(head.x, head.y, f.x, f.y); if (d < visionRange) potentialTargets.push({ target: f, weight: (f.radius > 10 ? 5 : 2) * (1 - d/visionRange) }); });
            const distToCenter = dist(head.x, head.y, KING_OF_THE_HILL_ZONE.x, KING_OF_THE_HILL_ZONE.y);
            if (distToCenter > KING_OF_THE_HILL_ZONE.radius) potentialTargets.push({ target: KING_OF_THE_HILL_ZONE, weight: 0.5 });
            if (potentialTargets.length > 0) { potentialTargets.sort((a,b) => b.weight - a.weight); this.target = potentialTargets[0].target; } 
            else { this.target = { x: Math.random() * WORLD_WIDTH, y: Math.random() * WORLD_HEIGHT }; }
        }
    }

    class BossBot extends Snake { /* ... No changes ... */
        constructor(name, x, y) { super(name, x, y, '#ff00ff', 200); this.normalSpeed = 1; this.turnSpeed = 0.02; }
        die() { this.isDead = true; soundEngine.play('death'); this.segments.forEach(seg => { if (Math.random() > 0.2) food.push({ x: seg.x, y: seg.y, radius: 7, color: this.color }); }); }
        findTarget() { if (!this.target || dist(this.segments[0].x, this.segments[0].y, this.target.x, this.target.y) < 100) { this.target = { x: Math.random() * WORLD_WIDTH, y: Math.random() * WORLD_HEIGHT }; } }
    }

    // --- UTILITY FUNCTIONS ---
    function saveGameData() { localStorage.setItem('snakeArenaDataV3', JSON.stringify(gameData)); }
    function loadGameData() {
        const savedData = localStorage.getItem('snakeArenaDataV3');
        if (savedData) {
            const parsedData = JSON.parse(savedData);
            gameData = {...gameData, ...parsedData};
            if (!gameData.unlockedSkins) gameData.unlockedSkins = ['Düz Renk'];
            if (!gameData.unlockedAbilities) gameData.unlockedAbilities = ['NONE'];
            if (!gameData.equippedAbility) gameData.equippedAbility = 'NONE';
        }
    }
    function getRandomColor() { return FRUIT_COLORS[Math.floor(Math.random() * FRUIT_COLORS.length)]; }
    function spawnFood(amount) { for (let i = 0; i < amount; i++) food.push({ x: Math.random() * WORLD_WIDTH, y: Math.random() * WORLD_HEIGHT, radius: Math.random() > 0.95 ? 12 : 6, color: getRandomColor() }); }
    function spawnPowerups() { /* ... No changes ... */
        if (powerups.length < 5 && Math.random() < 0.015) { 
             const rand = Math.random(); let type;
             if (rand < 0.4) type = POWERUP_TYPES.SHIELD;
             else if (rand < 0.8) type = POWERUP_TYPES.MAGNET;
             else type = POWERUP_TYPES.VISION;
             powerups.push({ x: Math.random() * WORLD_WIDTH, y: Math.random() * WORLD_HEIGHT, radius: 15, type: type, color: type === POWERUP_TYPES.SHIELD ? 'rgba(59, 130, 246, 0.8)' : (type === POWERUP_TYPES.MAGNET ? 'rgba(168, 85, 247, 0.8)' : 'rgba(34, 197, 94, 0.8)')});
        }
    }
    function dist(x1, y1, x2, y2) { return Math.hypot(x1 - x2, y1 - y2); }

    // --- INITIALIZATION ---
    function init() {
        resizeCanvas();
        soundEngine.startMusic();
        const selectedSkin = SKINS.find(s => s.name === gameData.selectedSkinName) || SKINS[0];
        const playerColor = selectedSkin.color || '#3b82f6';
        player = new Player(PLAYER_NAME, WORLD_WIDTH / 2, WORLD_HEIGHT / 2, playerColor);
        player.skin = { ...selectedSkin, baseColor: playerColor };
        
        bots = [];
        for (let i = 0; i < BOT_COUNT; i++) bots.push(new Bot(BOT_NAMES[i], Math.random() * WORLD_WIDTH, Math.random() * WORLD_HEIGHT, getRandomColor()));
        bots.push(new BossBot("Titan", Math.random() * WORLD_WIDTH, Math.random() * WORLD_HEIGHT));

        food = []; spawnFood(300); powerups = []; particles = []; pulseWaves = []; poisonTrails = []; decoys = []; worldTime = 0;
        gameStats.botsDefeated = 0; gameStats.powerupsCollected = 0;
        gameState = 'playing';
        gameModal.classList.add('hidden');
        canvas.style.cursor = 'none';
        if (animationFrameId) cancelAnimationFrame(animationFrameId);
        gameLoop();
    }
    
    // --- GAME LOOP ---
    function update() {
        if (gameState !== 'playing') return;
        player.update();
        if (player.isDead) { gameState = 'gameover'; showEndScreen(); }

        bots.forEach((bot, index) => {
            bot.update();
            if(bot.isDead) {
                if (!(bot instanceof BossBot)) {
                    if (bot !== player) gameStats.botsDefeated++;
                    bots.splice(index, 1);
                    setTimeout(() => { bots.push(new Bot(BOT_NAMES[Math.floor(Math.random() * BOT_NAMES.length)], Math.random() * WORLD_WIDTH, Math.random() * WORLD_HEIGHT, getRandomColor())); }, 3000);
                }
            }
        });
        
        particles.forEach((p, index) => { p.update(); if (p.lifespan <= 0) particles.splice(index, 1); });
        pulseWaves.forEach((wave, index) => { wave.update(); if(wave.lifespan <= 0) pulseWaves.splice(index, 1); });
        decoys.forEach((d, i) => { d.update(); if (d.lifespan <= 0) decoys.splice(i, 1); });
        
        checkCollisions(); updateWorld(); updateCamera(); updateLeaderboard(); updateUI();
    }

    function updateWorld() {
        spawnFood(2); spawnPowerups(); worldTime++;
        const allSnakes = [player, ...bots];
        allSnakes.forEach(snake => { if (!snake.isDead && dist(snake.segments[0].x, snake.segments[0].y, KING_OF_THE_HILL_ZONE.x, KING_OF_THE_HILL_ZONE.y) < KING_OF_THE_HILL_ZONE.radius) snake.score += 0.1; });
        pulseWaves.forEach((wave) => {
            allSnakes.forEach(snake => {
                if (snake === wave.owner || snake.isDead || snake.score >= wave.owner.score) return;
                const head = snake.segments[0]; const d = dist(wave.x, wave.y, head.x, head.y);
                if (d < wave.radius && d > wave.radius - wave.speed * 2) {
                    const pushAngle = Math.atan2(head.y - wave.y, head.x - wave.x);
                    const pushStrength = 1 + (wave.owner.score / (snake.score + 10)) * 2;
                    head.x += Math.cos(pushAngle) * pushStrength;
                    head.y += Math.sin(pushAngle) * pushStrength;
                }
            });
            food.forEach(f => {
                 const d = dist(wave.x, wave.y, f.x, f.y);
                 if (d < wave.radius && d > wave.radius - wave.speed * 2) {
                    const pushAngle = Math.atan2(f.y - wave.y, f.x - wave.x);
                    f.x += Math.cos(pushAngle) * 5; f.y += Math.sin(pushAngle) * 5;
                 }
            });
        });
        poisonTrails.forEach((puff, index) => {
            puff.update();
            if (puff.lifespan <= 0) { poisonTrails.splice(index, 1); return; }
            allSnakes.forEach(snake => {
                if (snake === puff.owner || snake.isDead) return;
                const head = snake.segments[0];
                if (dist(head.x, head.y, puff.x, puff.y) < snake.segmentRadius + puff.radius) {
                    snake.isPoisoned = true; snake.poisonedTimer = 180;
                }
            });
        });
    }

    function checkCollisions() {
        const allSnakes = [player, ...bots];
        allSnakes.forEach(snake => {
            if (snake.isDead) return;
            food.forEach((f, index) => {
                const head = snake.segments[0]; const d = dist(head.x, head.y, f.x, f.y);
                if (d < snake.segmentRadius + f.radius || (snake.magnetActive && d < 100)) { 
                    snake.grow(f.radius > 10 ? 10 : 3); 
                    food.splice(index, 1); 
                    if (snake === player) soundEngine.play('eat');
                }
            });
            powerups.forEach((p, index) => {
                const head = snake.segments[0];
                if (dist(head.x, head.y, p.x, p.y) < snake.segmentRadius + p.radius) {
                    if (p.type === POWERUP_TYPES.SHIELD) { snake.shieldActive = true; snake.shieldTimer = 300; }
                    else if (p.type === POWERUP_TYPES.MAGNET) { snake.magnetActive = true; snake.magnetTimer = 420; }
                    else if (p.type === POWERUP_TYPES.VISION) { snake.visionActive = true; snake.visionTimer = 600; }
                    if (snake === player) {
                        gameStats.powerupsCollected++;
                        soundEngine.play('powerup');
                    }
                    powerups.splice(index, 1);
                }
            });
        });

        for (let i = 0; i < allSnakes.length; i++) {
            for (let j = 0; j < decoys.length; j++) {
                const snake = allSnakes[i]; const decoy = decoys[j];
                if (snake.isDead) continue; const head = snake.segments[0];
                for (let k = 0; k < decoy.segments.length; k++) {
                    if (dist(head.x, head.y, decoy.segments[k].x, decoy.segments[k].y) < snake.segmentRadius) {
                        decoys.splice(j, 1); j--;
                        for(let p = 0; p < 30; p++) particles.push(new Particle(head.x, head.y, decoy.color, 4, 3, 60));
                        break;
                    }
                }
            }
        }

        for (let i = 0; i < allSnakes.length; i++) {
            for (let j = 0; j < allSnakes.length; j++) {
                if (i === j) continue;
                const snakeA = allSnakes[i]; const snakeB = allSnakes[j];
                if (snakeA.isDead || snakeB.isDead || snakeA.shieldActive || snakeA.ghostActive) continue;
                const headA = snakeA.segments[0];
                for (let k = 1; k < snakeB.segments.length; k++) {
                    if (dist(headA.x, headA.y, snakeB.segments[k].x, snakeB.segments[k].y) < snakeA.segmentRadius) { snakeA.die(); break; }
                }
            }
        }
    }
    
    function updateCamera() { /* ... No changes ... */
        const head = player.segments[0];
        const targetX = head.x - canvas.width / 2; const targetY = head.y - canvas.height / 2;
        const baseZoom = 1.2 - Math.min(player.segments.length / 500, 0.7); 
        const targetZoom = player.visionActive ? baseZoom * 1.5 : baseZoom;
        camera.x += (targetX - camera.x) * 0.1; camera.y += (targetY - camera.y) * 0.1;
        camera.zoom += (targetZoom - camera.zoom) * 0.05;
        camera.x = Math.max(0, Math.min(WORLD_WIDTH - canvas.width / camera.zoom, camera.x));
        camera.y = Math.max(0, Math.min(WORLD_HEIGHT - canvas.height / camera.zoom, camera.y));
    }

    function updateLeaderboard() { /* ... No changes ... */
        const allSnakes = [player, ...bots].filter(s => !s.isDead);
        allSnakes.sort((a, b) => b.score - a.score);
        leaderboardList.innerHTML = '';
        const top5 = allSnakes.slice(0, 5);
        top5.forEach(snake => {
            const li = document.createElement('li');
            li.textContent = `Lv.${snake.level} ${snake.name}: ${Math.floor(snake.score)}`;
            if (snake === player) { li.style.color = '#facc15'; li.style.fontWeight = 'bold'; }
            leaderboardList.appendChild(li);
        });
    }

    function updateUI() { /* ... No changes ... */
        if (gameData.equippedAbility === 'NONE') {
            equippedAbilityUI.classList.add('hidden');
            return;
        }
        equippedAbilityUI.classList.remove('hidden');
        const ability = ABILITIES.find(a => a.id === gameData.equippedAbility);
        equippedAbilityNameEl.textContent = `${ability.name} [G]`;
        const cooldownMax = player.ABILITY_COOLDOWN_MAX[gameData.equippedAbility];
        const cooldownPercent = (player.abilityCooldown / cooldownMax) * 100;
        abilityCooldownFill.style.width = `${100 - cooldownPercent}%`;
        abilityCooldownFill.style.backgroundColor = (player.abilityCooldown <= 0) ? ability.color : '#64748b';
    }

    // --- DRAWING ---
    function draw() {
        const dayNightRatio = 0.5 + Math.sin(worldTime / 1000) * 0.5;
        const bgColorIntensity = 20 + dayNightRatio * 20;
        canvas.style.backgroundColor = `rgb(${bgColorIntensity}, ${bgColorIntensity+5}, ${bgColorIntensity+15})`;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.save();
        ctx.translate(canvas.width / 2, canvas.height / 2); ctx.scale(camera.zoom, camera.zoom);
        ctx.translate(-camera.x - canvas.width / (2*camera.zoom), -camera.y - canvas.height / (2*camera.zoom));
        drawBackgroundGrid();
        ctx.fillStyle = 'rgba(250, 204, 21, 0.05)'; ctx.strokeStyle = 'rgba(250, 204, 21, 0.2)';
        ctx.lineWidth = 10; ctx.beginPath();
        ctx.arc(KING_OF_THE_HILL_ZONE.x, KING_OF_THE_HILL_ZONE.y, KING_OF_THE_HILL_ZONE.radius, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        food.forEach(f => { ctx.fillStyle = f.color; ctx.beginPath(); ctx.arc(f.x, f.y, f.radius, 0, Math.PI * 2); ctx.fill(); });
        powerups.forEach(p => {
             ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2); ctx.fill();
             ctx.fillStyle = 'white'; ctx.beginPath(); ctx.arc(p.x, p.y, p.radius * 0.4, 0, Math.PI * 2); ctx.fill();
        });
        poisonTrails.forEach(p => p.draw());
        decoys.forEach(d => d.draw());
        bots.forEach(bot => bot.draw());
        player.draw();
        particles.forEach(p => p.draw());
        pulseWaves.forEach(wave => wave.draw());
        ctx.restore();
        scoreEl.innerText = Math.floor(player.score);
        drawMinimap();
        drawCustomCursor();
    }
    
    function drawBackgroundGrid() { /* ... No changes ... */
        ctx.strokeStyle = "rgba(255, 255, 255, 0.05)"; ctx.lineWidth = 1; const gridSize = 50;
        for(let x = 0; x <= WORLD_WIDTH; x += gridSize) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, WORLD_HEIGHT); ctx.stroke(); }
        for(let y = 0; y <= WORLD_HEIGHT; y += gridSize) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(WORLD_WIDTH, y); ctx.stroke(); }
    }
    function drawCustomCursor() { /* ... No changes ... */
        if (gameState !== 'playing') return;
        const screenCenterX = canvas.width / 2; const screenCenterY = canvas.height / 2;
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(screenCenterX, screenCenterY); ctx.lineTo(mousePos.x, mousePos.y); ctx.stroke();
        const pulse = Math.sin(worldTime / 10) * 2;
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(mousePos.x, mousePos.y, 10 + pulse, 0, Math.PI * 2); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(mousePos.x - 5, mousePos.y); ctx.lineTo(mousePos.x + 5, mousePos.y);
        ctx.moveTo(mousePos.x, mousePos.y - 5); ctx.lineTo(mousePos.x, mousePos.y + 5); ctx.stroke();
    }
    function drawMinimap() { /* ... No changes ... */
        minimapCtx.fillStyle = 'rgba(40, 50, 70, 0.8)'; minimapCtx.fillRect(0, 0, MINIMAP_SIZE, MINIMAP_SIZE);
        const scaleX = MINIMAP_SIZE / WORLD_WIDTH; const scaleY = MINIMAP_SIZE / WORLD_HEIGHT;
        minimapCtx.strokeStyle = 'rgba(250, 204, 21, 0.5)'; minimapCtx.lineWidth = 1;
        minimapCtx.beginPath(); minimapCtx.arc(KING_OF_THE_HILL_ZONE.x * scaleX, KING_OF_THE_HILL_ZONE.y * scaleY, KING_OF_THE_HILL_ZONE.radius * scaleX, 0, Math.PI * 2); minimapCtx.stroke();
        const playerHead = player.segments[0];
        minimapCtx.fillStyle = 'yellow'; minimapCtx.fillRect(playerHead.x * scaleX - 2, playerHead.y * scaleY - 2, 4, 4);
        bots.forEach(bot => { minimapCtx.fillStyle = bot.color; minimapCtx.fillRect(bot.segments[0].x * scaleX - 1, bot.segments[0].y * scaleY - 1, 3, 3); });
        powerups.forEach(p => { minimapCtx.fillStyle = 'white'; minimapCtx.beginPath(); minimapCtx.arc(p.x * scaleX, p.y * scaleY, 2, 0, Math.PI * 2); minimapCtx.fill(); });
    }
    
    function gameLoop() { update(); draw(); animationFrameId = requestAnimationFrame(gameLoop); }
    
    function showEndScreen() {
        soundEngine.stopMusic();
        soundEngine.stopBoost();
        modalTitle.innerText = "Oyun Bitti!";
        modalTitle.classList.remove('text-green-500'); modalTitle.classList.add('text-red-500');
        const coinsEarned = Math.floor(player.score / 5);
        gameData.coins += coinsEarned;
        if (player.score > gameStats.maxScore) gameStats.maxScore = Math.floor(player.score);
        saveGameData();
        modalScore.innerHTML = `Skorun: ${Math.floor(player.score)} <span class="text-yellow-400 ml-2">(+${coinsEarned}💰)</span>`;
        maxScoreEl.innerText = gameStats.maxScore;
        botsDefeatedEl.innerText = gameStats.botsDefeated;
        powerupsCollectedEl.innerText = gameStats.powerupsCollected;
        statsContainer.classList.remove('hidden');
        startControls.classList.remove('hidden');
        startBtn.innerText = "Tekrar Oyna";
        gameModal.classList.remove('hidden');
        canvas.style.cursor = 'default';
    }

    // --- MARKET LOGIC ---
    function renderMarket() { /* ... No changes ... */
        coinBalanceEl.textContent = gameData.coins;
        if (currentMarketTab === 'skins') {
            skinSelectorContainer.style.display = 'block';
            abilitySelectorContainer.style.display = 'none';
            showSkinsTab.classList.add('active');
            showAbilitiesTab.classList.remove('active');
            renderSkinSelector();
        } else {
            skinSelectorContainer.style.display = 'none';
            abilitySelectorContainer.style.display = 'block';
            showSkinsTab.classList.remove('active');
            showAbilitiesTab.classList.add('active');
            renderAbilitySelector();
        }
    }

    function renderSkinSelector() { /* ... No changes ... */
        const skin = SKINS[currentSkinIndex];
        skinNameEl.textContent = skin.name;
        skinPreview.style.borderStyle = 'solid';
        const baseColor = skin.color || '#3b82f6';
        switch(skin.type) {
            case 'solid': skinPreview.style.background = baseColor; break;
            case 'striped': skinPreview.style.background = `repeating-linear-gradient(45deg, ${skin.colors[0]}, ${skin.colors[0]} 10px, ${skin.colors[1]} 10px, ${skin.colors[1]} 20px)`; break;
            case 'rainbow': skinPreview.style.background = 'linear-gradient(90deg, red, orange, yellow, green, blue, indigo, violet)'; break;
            case 'transparent': skinPreview.style.background = `repeating-linear-gradient(45deg, #fff, #fff 10px, #ccc 10px, #ccc 20px)`; break;
        }
        skinActionContainer.innerHTML = '';
        const isUnlocked = gameData.unlockedSkins.includes(skin.name);
        const isSelected = gameData.selectedSkinName === skin.name;
        if (isUnlocked) {
            if (isSelected) {
                const selectedBtn = document.createElement('button');
                selectedBtn.textContent = 'Seçildi'; selectedBtn.className = 'bg-gray-500 text-white font-bold py-2 px-5 rounded-lg cursor-default';
                skinActionContainer.appendChild(selectedBtn); skinPreview.style.borderColor = '#22c55e';
            } else {
                const selectBtn = document.createElement('button');
                selectBtn.textContent = 'Seç'; selectBtn.className = 'bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-5 rounded-lg transition';
                selectBtn.onclick = selectCurrentSkin;
                skinActionContainer.appendChild(selectBtn); skinPreview.style.borderColor = '#6b7280';
            }
        } else {
            const buyBtn = document.createElement('button');
            buyBtn.innerHTML = `Satın Al <span class="text-yellow-300 ml-1">${skin.cost}💰</span>`;
            if (gameData.coins >= skin.cost) {
                buyBtn.className = 'bg-green-500 hover:bg-green-600 text-white font-bold py-2 px-5 rounded-lg transition';
                buyBtn.onclick = buyCurrentSkin;
            } else {
                buyBtn.className = 'bg-red-700 text-gray-300 font-bold py-2 px-5 rounded-lg cursor-not-allowed';
                buyBtn.disabled = true;
            }
            skinActionContainer.appendChild(buyBtn); skinPreview.style.borderColor = '#6b7280';
        }
    }

    function renderAbilitySelector() { /* ... No changes ... */
        const ability = ABILITIES[currentAbilityIndex];
        abilityNameEl.textContent = ability.name;
        abilityDescriptionEl.textContent = ability.description;
        abilityActionContainer.innerHTML = '';
        const isUnlocked = gameData.unlockedAbilities.includes(ability.id);
        const isEquipped = gameData.equippedAbility === ability.id;

        if (isUnlocked) {
             if (isEquipped) {
                const equippedBtn = document.createElement('button');
                equippedBtn.textContent = 'Kullanımda'; equippedBtn.className = 'bg-gray-500 text-white font-bold py-2 px-5 rounded-lg cursor-default';
                abilityActionContainer.appendChild(equippedBtn);
             } else {
                const equipBtn = document.createElement('button');
                equipBtn.textContent = 'Kullan'; equipBtn.className = 'bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-5 rounded-lg transition';
                equipBtn.onclick = equipCurrentAbility;
                abilityActionContainer.appendChild(equipBtn);
             }
        } else {
            const buyBtn = document.createElement('button');
            buyBtn.innerHTML = `Satın Al <span class="text-yellow-300 ml-1">${ability.cost}💰</span>`;
            if (gameData.coins >= ability.cost) {
                buyBtn.className = 'bg-green-500 hover:bg-green-600 text-white font-bold py-2 px-5 rounded-lg transition';
                buyBtn.onclick = buyCurrentAbility;
            } else {
                buyBtn.className = 'bg-red-700 text-gray-300 font-bold py-2 px-5 rounded-lg cursor-not-allowed';
                buyBtn.disabled = true;
            }
            abilityActionContainer.appendChild(buyBtn);
        }
    }

    function selectCurrentSkin() { soundEngine.play('click'); const skin = SKINS[currentSkinIndex]; if (gameData.unlockedSkins.includes(skin.name)) { gameData.selectedSkinName = skin.name; saveGameData(); renderSkinSelector(); } }
    function buyCurrentSkin() {
        soundEngine.play('click');
        const skin = SKINS[currentSkinIndex];
        if (gameData.coins >= skin.cost && !gameData.unlockedSkins.includes(skin.name)) {
            gameData.coins -= skin.cost; gameData.unlockedSkins.push(skin.name);
            gameData.selectedSkinName = skin.name; saveGameData(); renderSkinSelector();
        }
    }
    function equipCurrentAbility() { soundEngine.play('click'); const ability = ABILITIES[currentAbilityIndex]; if(gameData.unlockedAbilities.includes(ability.id)){ gameData.equippedAbility = ability.id; saveGameData(); renderAbilitySelector(); } }
    function buyCurrentAbility() {
        soundEngine.play('click');
        const ability = ABILITIES[currentAbilityIndex];
        if (gameData.coins >= ability.cost && !gameData.unlockedAbilities.includes(ability.id)) {
            gameData.coins -= ability.cost; gameData.unlockedAbilities.push(ability.id);
            gameData.equippedAbility = ability.id; saveGameData(); renderAbilitySelector();
        }
    }

    // --- EVENT LISTENERS ---
    window.addEventListener('resize', resizeCanvas);
    document.addEventListener('keydown', e => { keysPressed[e.key.toLowerCase()] = true; keysPressed[e.code] = true; });
    document.addEventListener('keyup', e => { keysPressed[e.key.toLowerCase()] = false; keysPressed[e.code] = false; });
    
    startBtn.addEventListener('click', () => { soundEngine.init(); soundEngine.play('click'); init(); });
    openMarketBtn.addEventListener('click', () => { soundEngine.init(); soundEngine.play('click'); gameModal.classList.add('hidden'); skinMarketModal.style.display = 'flex'; currentMarketTab='skins'; renderMarket(); });
    closeMarketBtn.addEventListener('click', () => { soundEngine.play('click'); skinMarketModal.style.display = 'none'; gameModal.classList.remove('hidden'); });
    
    // Market Tabs
    showSkinsTab.addEventListener('click', () => { soundEngine.play('click'); currentMarketTab = 'skins'; renderMarket(); });
    showAbilitiesTab.addEventListener('click', () => { soundEngine.play('click'); currentMarketTab = 'abilities'; renderMarket(); });
    
    // Market Navigation
    prevSkinBtn.addEventListener('click', () => { soundEngine.play('click'); currentSkinIndex = (currentSkinIndex - 1 + SKINS.length) % SKINS.length; renderSkinSelector(); });
    nextSkinBtn.addEventListener('click', () => { soundEngine.play('click'); currentSkinIndex = (currentSkinIndex + 1) % SKINS.length; renderSkinSelector(); });
    prevAbilityBtn.addEventListener('click', () => { soundEngine.play('click'); currentAbilityIndex = (currentAbilityIndex - 1 + ABILITIES.length) % ABILITIES.length; renderAbilitySelector(); });
    nextAbilityBtn.addEventListener('click', () => { soundEngine.play('click'); currentAbilityIndex = (currentAbilityIndex + 1) % ABILITIES.length; renderAbilitySelector(); });
    
    canvas.addEventListener('mousemove', e => { mousePos.x = e.clientX; mousePos.y = e.clientY; });
    canvas.addEventListener('contextmenu', e => e.preventDefault());
    canvas.addEventListener('mousedown', e => { if (e.button === 0) isLeftMouseDown = true; if (e.button === 2 && gameState === 'playing') player.ejectMass(); });
    canvas.addEventListener('mouseup', e => { if (e.button === 0) isLeftMouseDown = false; });
    
    // --- INITIALIZE ---
    function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; minimapCanvas.width = MINIMAP_SIZE; minimapCanvas.height = MINIMAP_SIZE; }
    loadGameData();
    resizeCanvas();
    canvas.style.cursor = 'default';
    </script>
</body>
</html>
